[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wm"
version = "0.1.0"
description = "FIFA World Cup 2026 prediction system"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "typer>=0.9",
    "rich>=13.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
    "rdata>=0.11",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# pyarrow has no wheels on some platforms (e.g. Termux/Android);
# the code falls back to pickle storage when it is absent.
parquet = ["pyarrow>=13.0"]
dev = ["pytest>=7.4", "pytest-cov", "black", "ruff", "pyarrow>=13.0"]

[project.scripts]
wm = "wm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
