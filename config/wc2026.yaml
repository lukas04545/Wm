# Bracket: R32 slot assignments for third-place finishers
# Maps sorted tuple of groups that provided 8 third-placers → slot assignments
# Slot format: which R32 match each third-placer fills
# Based on FIFA Annex C (simplified representative mapping)
# Full 495-combination table is generated programmatically in tournament.py
r32_bracket_slots:
  # R32 match indices (0-based): which group positions feed each match
  # Format: [team_a_source, team_b_source]
  # Sources: "A1"=Group A winner, "B2"=Group B runner-up, "3rd_X"=best 3rd from group X
  fixed_matches:
    - [A1, 3rd_BCDE]
    - [B1, A2]
    - [C1, 3rd_AFJK]
    - [D1, C2]
    - [E1, 3rd_GHIL]
    - [F1, E2]
    - [G1, F2]
    - [H1, G2]
    - [I1, H2]
    - [J1, I2]
    - [K1, J2]
    - [L1, K2]
    - [3rd_ABCD, L2]
    - [3rd_EFGH, D2]
    - [3rd_IJKL, B2]
    - [3rd_5th, 3rd_6th]
