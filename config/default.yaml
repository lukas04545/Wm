paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  models: models
  reports: reports

elo:
  k_wc: 60
  k_continental: 50
  k_qualifier: 40
  k_friendly: 20
  home_advantage: 100
  initial: 1500

features:
  form_windows: [5, 10, 15]
  h2h_window: 10
  min_train_date: "1990-01-01"
  weight_halflife_years: 8

model:
  wdl:
    n_estimators: 4000
    learning_rate: 0.02
    num_leaves: 31
    min_child_samples: 40
    subsample: 0.8
    colsample_bytree: 0.7
    lambda_l2: 1.0
    early_stopping_rounds: 80
    verbose: -1
  goals:
    n_estimators: 2000
    learning_rate: 0.02
    num_leaves: 31
    min_child_samples: 40
    colsample_bytree: 0.7
    lambda_l2: 1.0
    early_stopping_rounds: 80
    objective: poisson
    verbose: -1
  nn:
    n_models: 3            # bagged seeds
    hidden: [192, 96, 48]
    learning_rate: 0.0008
    l2: 0.0003
    dropout: 0.3
    max_epochs: 300
    patience: 20
  blend_weight: 0.5  # legacy 2-branch fallback only

simulation:
  n_runs: 100000
  seed: 42
  squad_noise_std: 0.03  # team-strength perturbation per run
  max_goals_grid: 10
  et_lambda_factor: 0.333  # extra time goal rate vs 90-min rate
  penalty_home_advantage: 0.0
  base_penalty_conversion: 0.75

splits:
  train_ratio: 0.8   # first 80% of time-sorted matches → train, last 20% → val
  # Legacy date references (used by split_by_date() helper only)
  train_end: "2017-12-31"
  val_end: "2021-12-31"
